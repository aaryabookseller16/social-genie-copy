name: Learn user context

# Every 10 minutes, asks Xano to learn signed-in users' likes and dislikes from recent Genie
# chats (genie/ep_learn_job_run_dev on the capstone branch). Xano runs scheduled tasks only on
# its live branch, so the schedule lives here. The endpoint always uses the tamu_capstone
# datasource and does nothing when there are no new messages. GitHub may delay scheduled runs
# by a few minutes; the job picks up whatever is new.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: learn-user-context
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run the learning job
        env:
          JOB_URL: https://xwpg-kuah-brlj.n7d.xano.io/api:pgMKWi2e:flutter-v2-sandbox-tamu-capstone/genie/ep_learn_job_run_dev
        run: |
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 420 \
            -X POST "$JOB_URL" \
            -H "Content-Type: application/json" \
            -H "X-Data-Source: tamu_capstone" \
            -d '{}')
          cat response.json
          echo
          test "$status" = "200"
